<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" class="method-diagram" role="img" aria-labelledby="method-timeline-zh-title method-timeline-zh-desc">
    <title id="method-timeline-zh-title">训练窗口截至被解释日的前一天</title><desc id="method-timeline-zh-desc">窗口止于 t−1，用窗口内估计的系数乘以 t 日的因子变动。</desc>
    <style>
      .method-diagram { background:var(--panel,#fff); }
      .method-diagram text { fill:var(--text,#20243b); font-family:var(--display,'Segoe UI',Arial,sans-serif); }
      .method-diagram .eyebrow { font-size:15px; letter-spacing:1.3px; fill:var(--mute,#5f6484); }
      .method-diagram .heading { font-size:28px; font-weight:500; }
      .method-diagram .body { font-size:21px; }
      .method-diagram .small { font-size:15px; fill:var(--text-3,#535874); }
      .method-diagram .mono { font:18px var(--mono,Consolas,monospace); }
      .method-diagram .rule { stroke:var(--line-2,#dfe1eb); stroke-width:1; }
      .method-diagram .wire { stroke:var(--text-3,#535874); stroke-width:1.5; fill:none; }
      .method-diagram .connector { stroke:var(--mute,#8a8fa8); stroke-width:1.2; fill:none; }
      .method-diagram .boundary { stroke:var(--mute,#8a8fa8); stroke-dasharray:3 7; }
      .method-diagram .tile { fill:var(--raise,#f1f1f8); stroke:var(--line-2,#dfe1eb); }
      .method-diagram .cell { fill:var(--text-3,#535874); opacity:.22; }
      .method-diagram .faint { opacity:.12; }
      .method-diagram .node { fill:var(--text-3,#535874); }
      .method-diagram .day { fill:var(--raise,#f1f1f8); stroke:var(--text,#20243b); stroke-width:2; }
      .method-diagram .sys { fill:var(--sys,#6247d6); }
      .method-diagram .exo { fill:var(--exo,#1479c9); }
      .method-diagram .res { fill:var(--res,#7f9c07); }
    </style>
    <rect x="0" y="0" width="960" height="416" fill="var(--panel,#fff)"/>
    <text x="40" y="49" class="eyebrow" text-anchor="start">用于拟合的历史观测</text><text x="726" y="49" class="eyebrow" text-anchor="middle">被解释日</text><text x="896" y="49" class="eyebrow" text-anchor="middle">后续</text>
    <text x="40" y="90" class="mono" text-anchor="start">t−w</text><text x="593" y="90" class="mono" text-anchor="end">t−1</text><text x="726" y="90" class="mono" text-anchor="middle">t</text>
    <rect x="40" y="117" width="28" height="58" class="cell"/><rect x="75" y="117" width="28" height="58" class="cell"/><rect x="110" y="117" width="28" height="58" class="cell"/><rect x="145" y="117" width="28" height="58" class="cell"/><rect x="180" y="117" width="28" height="58" class="cell"/><rect x="215" y="117" width="28" height="58" class="cell"/><rect x="250" y="117" width="28" height="58" class="cell"/><rect x="285" y="117" width="28" height="58" class="cell"/><rect x="320" y="117" width="28" height="58" class="cell"/><rect x="355" y="117" width="28" height="58" class="cell"/><rect x="390" y="117" width="28" height="58" class="cell"/><rect x="425" y="117" width="28" height="58" class="cell"/><rect x="460" y="117" width="28" height="58" class="cell"/><rect x="495" y="117" width="28" height="58" class="cell"/><rect x="530" y="117" width="28" height="58" class="cell"/><rect x="565" y="117" width="28" height="58" class="cell"/><rect x="690" y="117" width="72" height="58" class="day"/><rect x="824" y="117" width="28" height="58" class="cell faint"/><rect x="864" y="117" width="28" height="58" class="cell faint"/>
    <line x1="650" y1="65" x2="650" y2="207" class="boundary"/>
    <path d="M40 192v10h553v-10" class="wire"/><text x="316" y="232" class="body" text-anchor="middle">w 个交易日</text>
    <path d="M316 264v18h410m-7-6 7 6-7 6" class="wire"/>
    <text x="316" y="313" class="small" text-anchor="middle">在此窗口估计 β</text><text x="726" y="232" class="body" text-anchor="middle">将 β 应用于 xₜ</text><text x="726" y="257" class="small" text-anchor="middle">读取 yₜ，计算残差</text>
    <line x1="40" y1="347" x2="920" y2="347" class="rule"/><text x="40" y="384" class="small" text-anchor="start">下一交易日，窗口的起点与终点同时向前移动一天。</text>
  </svg>
