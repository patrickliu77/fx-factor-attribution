      <path d="M143 199H338" class="connector faint"/>
      <rect x="345" y="187" width="110" height="24" class="cell faint"/>
      <text x="400" y="204" class="small" text-anchor="middle">0</text>
      <rect x="40" y="217" width="96" height="24" class="tile"/><text x="88" y="234" class="mono" text-anchor="middle">x5</text>
      <path d="M143 229H338" class="connector faint"/>
      <rect x="345" y="217" width="110" height="24" class="cell faint"/>
      <text x="400" y="234" class="small" text-anchor="middle">0</text>
      <rect x="40" y="247" width="96" height="24" class="tile"/><text x="88" y="264" class="mono" text-anchor="middle">x6</text>
      <path d="M143 259H338" class="wire"/>
      <rect x="345" y="247" width="110" height="24" class="tile"/>
      <text x="400" y="264" class="mono" text-anchor="middle">x6</text>
