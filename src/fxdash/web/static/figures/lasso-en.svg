<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" class="method-diagram" role="img" aria-labelledby="method-lasso-en-title method-lasso-en-desc">
    <title id="method-lasso-en-title">Selection, then estimation</title><desc id="method-lasso-en-desc">An illustrative set of eight candidate variables is reduced to three. OLS fits new coefficients on the retained columns.</desc>
    <style>
      .method-diagram { background:var(--panel,#fff); }
      .method-diagram text { fill:var(--text,#20243b); font-family:var(--display,'Segoe UI',Arial,sans-serif); }
      .method-diagram .eyebrow { font-size:15px; letter-spacing:1.3px; fill:var(--mute,#5f6484); }
      .method-diagram .heading { font-size:28px; font-weight:500; }
      .method-diagram .body { font-size:21px; }
      .method-diagram .small { font-size:15px; fill:var(--text-3,#535874); }
      .method-diagram .mono { font:18px var(--mono,Consolas,monospace); }
      .method-diagram .rule { stroke:var(--line-2,#dfe1eb); stroke-width:1; }
      .method-diagram .wire { stroke:var(--text-3,#535874); stroke-width:1.5; fill:none; }
      .method-diagram .connector { stroke:var(--mute,#8a8fa8); stroke-width:1.2; fill:none; }
      .method-diagram .boundary { stroke:var(--mute,#8a8fa8); stroke-dasharray:3 7; }
      .method-diagram .tile { fill:var(--raise,#f1f1f8); stroke:var(--line-2,#dfe1eb); }
      .method-diagram .cell { fill:var(--text-3,#535874); opacity:.22; }
      .method-diagram .faint { opacity:.12; }
      .method-diagram .node { fill:var(--text-3,#535874); }
      .method-diagram .day { fill:var(--raise,#f1f1f8); stroke:var(--text,#20243b); stroke-width:2; }
      .method-diagram .sys { fill:var(--sys,#6247d6); }
      .method-diagram .exo { fill:var(--exo,#1479c9); }
      .method-diagram .res { fill:var(--res,#7f9c07); }
    </style>
    <rect x="0" y="0" width="960" height="480" fill="var(--panel,#fff)"/>
    <text x="40" y="48" class="eyebrow" text-anchor="start">01 / CANDIDATES</text><text x="345" y="48" class="eyebrow" text-anchor="start">02 / LASSO SELECTION</text><text x="650" y="48" class="eyebrow" text-anchor="start">03 / OLS REFIT</text>
    <text x="40" y="76" class="small" text-anchor="start">Up to eight variables</text><text x="345" y="76" class="small" text-anchor="start">Keep columns with nonzero coefficients</text><text x="650" y="76" class="small" text-anchor="start">Fit new coefficients on the selected columns</text><rect x="40" y="97" width="96" height="24" class="tile"/><text x="88" y="114" class="mono" text-anchor="middle">x1</text>
      <path d="M143 109H338" class="wire"/>
      <rect x="345" y="97" width="110" height="24" class="tile"/>
      <text x="400" y="114" class="mono" text-anchor="middle">x1</text>
      <path d="M464 109C547 109 566 149 636 149" class="connector"/><rect x="40" y="127" width="96" height="24" class="tile"/><text x="88" y="144" class="mono" text-anchor="middle">x2</text>
      <path d="M143 139H338" class="connector faint"/>
