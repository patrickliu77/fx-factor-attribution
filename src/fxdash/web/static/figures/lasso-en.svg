      <path d="M143 289H338" class="connector faint"/>
      <rect x="345" y="277" width="110" height="24" class="cell faint"/>
      <text x="400" y="294" class="small" text-anchor="middle">0</text>
      <rect x="40" y="307" width="96" height="24" class="tile"/><text x="88" y="324" class="mono" text-anchor="middle">x8</text>
      <path d="M143 319H338" class="connector faint"/>
      <rect x="345" y="307" width="110" height="24" class="cell faint"/>
      <text x="400" y="324" class="small" text-anchor="middle">0</text>

    <rect x="646" y="132" width="64" height="32" class="tile"/><text x="678" y="154" class="mono" text-anchor="middle">x1</text><text x="741" y="154" class="heading" text-anchor="start">β1</text><rect x="646" y="191" width="64" height="32" class="tile"/><text x="678" y="213" class="mono" text-anchor="middle">x3</text><text x="741" y="213" class="heading" text-anchor="start">β3</text><rect x="646" y="250" width="64" height="32" class="tile"/><text x="678" y="272" class="mono" text-anchor="middle">x6</text><text x="741" y="272" class="heading" text-anchor="start">β6</text>
    <text x="650" y="321" class="body" text-anchor="start">Selected set S</text><text x="650" y="350" class="small" text-anchor="start">Refit β × factor move → contribution</text>
    <line x1="40" y1="385" x2="920" y2="385" class="rule"/><text x="40" y="420" class="small" text-anchor="start">Empty selection: all factor contributions are zero; the full return enters the residual.</text><text x="40" y="449" class="small" text-anchor="start">Illustration of the procedure; selection varies with the pair and window.</text>
  </svg>
