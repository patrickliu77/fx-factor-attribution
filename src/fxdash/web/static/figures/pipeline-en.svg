<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" class="method-diagram" role="img" aria-labelledby="method-pipeline-en-title method-pipeline-en-desc">
    <title id="method-pipeline-en-title">From observations to a daily record</title><desc id="method-pipeline-en-desc">Market observations form an aligned panel. Each estimator produces its own coefficients and three contribution groups.</desc>
    <style>
      .method-diagram { background:var(--panel,#fff); }
      .method-diagram text { fill:var(--text,#20243b); font-family:var(--display,'Segoe UI',Arial,sans-serif); }
      .method-diagram .eyebrow { font-size:15px; letter-spacing:1.3px; fill:var(--mute,#5f6484); }
      .method-diagram .heading { font-size:28px; font-weight:500; }
      .method-diagram .body { font-size:21px; }
      .method-diagram .small { font-size:15px; fill:var(--text-3,#535874); }
      .method-diagram .mono { font:18px var(--mono,Consolas,monospace); }
      .method-diagram .rule { stroke:var(--line-2,#dfe1eb); stroke-width:1; }
      .method-diagram .wire { stroke:var(--text-3,#535874); stroke-width:1.5; fill:none; }
      .method-diagram .connector { stroke:var(--mute,#8a8fa8); stroke-width:1.2; fill:none; }
      .method-diagram .boundary { stroke:var(--mute,#8a8fa8); stroke-dasharray:3 7; }
      .method-diagram .tile { fill:var(--raise,#f1f1f8); stroke:var(--line-2,#dfe1eb); }
      .method-diagram .cell { fill:var(--text-3,#535874); opacity:.22; }
      .method-diagram .faint { opacity:.12; }
      .method-diagram .node { fill:var(--text-3,#535874); }
      .method-diagram .day { fill:var(--raise,#f1f1f8); stroke:var(--text,#20243b); stroke-width:2; }
      .method-diagram .sys { fill:var(--sys,#6247d6); }
      .method-diagram .exo { fill:var(--exo,#1479c9); }
      .method-diagram .res { fill:var(--res,#7f9c07); }
    </style>
    <rect x="0" y="0" width="960" height="720" fill="var(--panel,#fff)"/>
    <text x="40" y="55" class="eyebrow" text-anchor="start">01 / OBSERVATIONS</text><text x="512" y="55" class="eyebrow" text-anchor="start">02 / ALIGN BY PAIR</text>
    <rect x="40" y="92" width="38" height="38" class="tile"/>
    <path d="M48 116h8v-12h8v16h8" class="wire"/>
    <text x="96" y="118" class="body" text-anchor="start">Six USD exchange rates</text><text x="96" y="141" class="small" text-anchor="start">Daily log returns</text>
    <path d="M398 111 C448 111 440 190 486 190" class="connector"/>
    <rect x="40" y="170" width="38" height="38" class="tile"/>
    <path d="M48 198v-12m8 12v-18m8 18v-8m8 8v-23" class="wire"/>
    <text x="96" y="196" class="body" text-anchor="start">Yields, VIX, commodities, credit</text><text x="96" y="219" class="small" text-anchor="start">Official yields + market series</text>
    <path d="M398 189 C448 189 440 190 486 190" class="connector"/>
    <rect x="40" y="248" width="38" height="38" class="tile"/>
    <circle cx="52" cy="268" r="4" class="node"/><circle cx="67" cy="268" r="4" class="node"/><circle cx="59" cy="279" r="4" class="node"/>
    <text x="96" y="274" class="body" text-anchor="start">Dollar &amp; carry baskets</text><text x="96" y="297" class="small" text-anchor="start">Explained pair excluded</text>
    <path d="M398 267 C448 267 440 190 486 190" class="connector"/>
    <path d="M486 190h14l-6-5m6 5-6 5" class="wire"/>
    <text x="512" y="98" class="body" text-anchor="start">One date axis, matched market closes</text><rect x="516" y="129" width="44" height="12" class="cell"/><rect x="575" y="129" width="44" height="12" class="cell faint"/><rect x="634" y="129" width="44" height="12" class="cell faint"/><rect x="693" y="129" width="44" height="12" class="cell faint"/><rect x="752" y="129" width="44" height="12" class="cell faint"/><rect x="811" y="129" width="44" height="12" class="cell faint"/><rect x="516" y="155" width="44" height="12" class="cell"/><rect x="575" y="155" width="44" height="12" class="cell faint"/><rect x="634" y="155" width="44" height="12" class="cell faint"/><rect x="693" y="155" width="44" height="12" class="cell faint"/><rect x="752" y="155" width="44" height="12" class="cell faint"/><rect x="811" y="155" width="44" height="12" class="cell faint"/><rect x="516" y="181" width="44" height="12" class="cell"/><rect x="575" y="181" width="44" height="12" class="cell faint"/><rect x="634" y="181" width="44" height="12" class="cell faint"/><rect x="693" y="181" width="44" height="12" class="cell faint"/><rect x="752" y="181" width="44" height="12" class="cell faint"/><rect x="811" y="181" width="44" height="12" class="cell faint"/><rect x="516" y="207" width="44" height="12" class="cell"/><rect x="575" y="207" width="44" height="12" class="cell faint"/><rect x="634" y="207" width="44" height="12" class="cell faint"/><rect x="693" y="207" width="44" height="12" class="cell faint"/><rect x="752" y="207" width="44" height="12" class="cell faint"/><rect x="811" y="207" width="44" height="12" class="cell faint"/><text x="512" y="261" class="small" text-anchor="start">Each row holds a return and its factor moves.</text>
    <line x1="40" y1="324" x2="920" y2="324" class="rule"/><text x="40" y="358" class="eyebrow" text-anchor="start">03 / FIT THROUGH t−1</text><text x="920" y="358" class="small" text-anchor="end">63, 126 or 252 trading days</text>
    <text x="40" y="405" class="heading" text-anchor="start">OLS</text><text x="40" y="434" class="small" text-anchor="start">Baseline factor set</text><text x="345" y="405" class="heading" text-anchor="start">Ridge</text><text x="345" y="434" class="small" text-anchor="start">Shrink coefficients</text><text x="650" y="405" class="heading" text-anchor="start">Lasso + OLS</text><text x="650" y="434" class="small" text-anchor="start">Select, then refit with OLS</text>
    <line x1="326" y1="382" x2="326" y2="439" class="rule"/><line x1="631" y1="382" x2="631" y2="439" class="rule"/>
    <text x="40" y="477" class="small" text-anchor="start">Each estimator keeps its own result.</text><path d="M875 386v98m-6-7 6 7 6-7" class="wire"/>
    <line x1="40" y1="508" x2="920" y2="508" class="rule"/><text x="40" y="544" class="eyebrow" text-anchor="start">04 / ACCOUNT FOR DAY t</text><text x="920" y="544" class="small" text-anchor="end">Coefficients in original units × day t factor moves</text>

      <rect x="40" y="572" width="265" height="4" class="sys"/><text x="40" y="609" class="body" text-anchor="start">Systematic</text><text x="40" y="635" class="small" text-anchor="start">Dollar + carry</text>
      <rect x="345" y="572" width="265" height="4" class="exo"/><text x="345" y="609" class="body" text-anchor="start">Exogenous</text><text x="345" y="635" class="small" text-anchor="start">Rates + risk + commodities</text>
      <rect x="650" y="572" width="265" height="4" class="res"/><text x="650" y="609" class="body" text-anchor="start">Residual</text><text x="650" y="635" class="small" text-anchor="start">Return less contributions</text>
    <text x="40" y="685" class="small" text-anchor="start">Daily records → dashboard &amp; period sums</text><text x="920" y="685" class="small" text-anchor="end">Large residuals → news retrieval &amp; review</text>
  </svg>
