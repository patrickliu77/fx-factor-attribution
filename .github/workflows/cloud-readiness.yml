name: Cloud readiness (offline)

on:
  workflow_dispatch:
  push:
    branches: [cloud-readiness]

permissions:
  contents: read

concurrency:
  group: fx-cloud-readiness
  cancel-in-progress: false

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      FXDASH_AUDIO: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.5"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.15.0"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic offline tests
        run: python -m pytest -q
      # The candidate branch can test itself without enabling a production job.
      # No provider secrets, private snapshots, uploads, deployment or email step.
